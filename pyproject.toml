[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "electronics-engineering-ai999x"
version = "1.5.0"
description = "Offline electronics engineering solver: semiconductors and pn junctions, diode circuits and rectifiers, BJT and MOSFET biasing and amplifiers, op-amp circuits, active filters, oscillators and 555 timers, ADCs and DACs, digital timing and power supplies, with steps, LaTeX and honest refusals"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "AI999X Labs", email = "support@ai999x.com"}, {name = "Ibnul Jaif Farabi", email = "ibnuljaiffarabi@ai999x.com"}]
maintainers = [{name = "AI999X Labs", email = "support@ai999x.com"}]
keywords = ["electronics engineering", "semiconductors", "diodes", "bjt", "mosfet", "amplifiers", "op-amp", "active filters", "oscillators", "adc", "dac", "555 timer", "ai999x", "offline", "cpu", "step-by-step", "latex", "solver"]
classifiers = ["License :: OSI Approved :: Apache Software License", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3 :: Only", "Operating System :: OS Independent", "Intended Audience :: Education", "Intended Audience :: Science/Research", "Intended Audience :: Developers", "Topic :: Scientific/Engineering", "Topic :: Education", "Development Status :: 5 - Production/Stable"]
dependencies = ["sympy>=1.12", "mpmath>=1.3"]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
all = ["matplotlib>=3.7", "numpy>=1.24"]

[project.scripts]
electronics-engineering-ai999x = "electronics_engineering_ai999x.cli:main"

[project.urls]
"Source" = "https://github.com/AI999X/electronics-engineering-ai999x"
"Issues" = "https://github.com/AI999X/electronics-engineering-ai999x/issues"
"Homepage" = "https://ai999x.com"
"Hugging Face" = "https://huggingface.co/AI999X/electronics-engineering-ai999x"
"Funding" = "https://buymeacoffee.com/ibnuljaiffarabi"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
electronics_engineering_ai999x = ["pack/*.json", "pack/*/*.json", "pack/*.sqlite", "pack/capabilities/*.py", "pack/search/*.onnx"]
